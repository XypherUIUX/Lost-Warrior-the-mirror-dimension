for (const k in SPRITES) { const s = SPRITES[k]; s.img = new Image(); s.img.src = s.src; }

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const VIEW_H = 700, WORLD_DY = 80, WORLD_BOT = 620; // camera pulled back: world (540 tall) sits inside a 700 view
let VW = 960;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  const sc = cv.height / VIEW_H;
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  VW = cv.width / sc;
}
addEventListener('resize', resize);

const WORLD_W = 1700, FLOOR_Y = 452;
const platforms = [
  { x: 210, y: 356, w: 170 }, { x: 520, y: 286, w: 150 }, { x: 830, y: 356, w: 170 },
  { x: 1130, y: 262, w: 150 }, { x: 1400, y: 344, w: 180 }
];
// ambient mirror shards (background decoration)
const shards = [];
for (let i = 0; i < 26; i++) shards.push({ x: Math.random()*WORLD_W, y: 40+Math.random()*300, s: 6+Math.random()*20, r: Math.random()*Math.PI, p: Math.random()<0.5?0.35:0.6, ph: Math.random()*6.28 });
const embers = [];
for (let i = 0; i < 22; i++) embers.push({ x: Math.random()*WORLD_W, y: Math.random()*540, v: .15+Math.random()*.35, s: 1+Math.random()*1.8, ph: Math.random()*6.28 });

const P = { x: 140, y: FLOOR_Y, vx: 0, vy: 0, dir: 1, ground: true, plat: null,
  anim: 'idle', at: 0, atkT: 0, dashT: 0, dashCD: 0, landT: 0, airDash: false };
const keys = { left:false, right:false, run:false };
let jumpQueued = false, atkQueued = false, dashQueued = false;
const particles = [];

function bindBtn(id, down, up) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); el.classList.add('on'); down(); };
  const off = e => { e.preventDefault(); el.classList.remove('on'); if (up) up(); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('bLeft',  () => keys.left = true,  () => keys.left = false);
bindBtn('bRight', () => keys.right = true, () => keys.right = false);
bindBtn('bRun',   () => keys.run = true,   () => keys.run = false);
bindBtn('bJump',  () => jumpQueued = true);
bindBtn('bAtk',   () => atkQueued = true);
bindBtn('bDash',  () => dashQueued = true);

addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a') keys.left = true;
  if (k === 'ArrowRight' || k === 'd') keys.right = true;
  if (k === 'Shift') keys.run = true;
  if (k === 'ArrowUp' || k === 'w' || k === ' ') jumpQueued = true;
  if (k === 'x' || k === 'j') atkQueued = true;
  if (k === 'c' || k === 'k') dashQueued = true;
  if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a') keys.left = false;
  if (k === 'ArrowRight' || k === 'd') keys.right = false;
  if (k === 'Shift') keys.run = false;
});

function frameOf() {
  // returns [spriteName, frameIndex]
  if (P.dashT > 0) return ['dash', 0];
  if (P.atkT > 0) {
    const t = 380 - P.atkT;
    return ['slash', t < 150 ? 0 : t < 225 ? 1 : t < 320 ? 2 : 3];
  }
  if (!P.ground) return ['jump', P.vy < -1.5 ? 1 : 2];
  if (P.landT > 0) return ['jump', 0];
  if (Math.abs(P.vx) > 0.2) {
    const sp = keys.run ? 'run' : 'walk';
    const rate = keys.run ? 80 : 105;
    return [sp, Math.floor(P.at / rate) % SPRITES[sp].frames];
  }
  return ['idle', 0];
}

let last = performance.now();
function loop(now) {
  let dt = Math.min(32, now - last); last = now;
  const step = dt / 16.667;
  P.at += dt;

  // ---- input / movement ----
  const accel = P.ground ? 0.9 : 0.55;
  const maxSp = keys.run ? 3.4 : 1.7;
  if (P.dashT <= 0 && P.atkT <= 260) {
    if (keys.left)  { P.vx = Math.max(P.vx - accel*step, -maxSp); P.dir = -1; }
    if (keys.right) { P.vx = Math.min(P.vx + accel*step,  maxSp); P.dir = 1; }
    if (!keys.left && !keys.right) P.vx *= P.ground ? Math.pow(0.55, step) : Math.pow(0.92, step);
    if (Math.abs(P.vx) < 0.02 && !keys.left && !keys.right) P.vx = 0;
  }
  if (jumpQueued) {
    jumpQueued = false;
    if (P.ground && P.dashT <= 0) { P.vy = -11.6; P.ground = false; P.plat = null; }
  }
  if (atkQueued) { atkQueued = false; if (P.atkT <= 0) P.atkT = 380; }
  if (dashQueued) {
    dashQueued = false;
    if (P.dashCD <= 0 && (P.ground || !P.airDash)) {
      P.dashT = 175; P.dashCD = 620; if (!P.ground) P.airDash = true;
      P.vy = 0;
    }
  }
  if (P.atkT > 0) P.atkT -= dt;
  if (P.dashCD > 0) P.dashCD -= dt;
  if (P.landT > 0) P.landT -= dt;

  // ---- physics ----
  if (P.dashT > 0) {
    P.dashT -= dt;
    P.vx = P.dir * 9.2;
    if (Math.random() < 0.85) particles.push({ x: P.x - P.dir*18 + (Math.random()*14-7), y: P.y - 20 - Math.random()*55,
      vx: -P.dir*(0.6+Math.random()), vy: (Math.random()-0.5)*0.7, life: 320+Math.random()*220, t: 0, s: 1.5+Math.random()*2.6, ember: true });
  } else {
    P.vy = Math.min(P.vy + 0.52*step, 13);
  }
  const prevFeet = P.y;
  P.x += P.vx * step;
  P.y += P.vy * step;
  if (P.x < 34) { P.x = 34; } if (P.x > WORLD_W - 34) { P.x = WORLD_W - 34; }

  const wasGround = P.ground;
  P.ground = false;
  if (P.vy >= 0) {
    // floor
    if (P.y >= FLOOR_Y) {
      if (!wasGround && P.vy > 6) { P.landT = 95; dust(); }
      P.y = FLOOR_Y; P.vy = 0; P.ground = true; P.airDash = false;
    } else {
      for (const pl of platforms) {
        if (prevFeet <= pl.y + 0.5 && P.y >= pl.y && P.x > pl.x - 14 && P.x < pl.x + pl.w + 14) {
          if (!wasGround && P.vy > 6) { P.landT = 95; dust(); }
          P.y = pl.y; P.vy = 0; P.ground = true; P.airDash = false; P.plat = pl;
        }
      }
    }
  }
  if (P.y < FLOOR_Y && !P.ground && P.plat && (P.x < P.plat.x - 14 || P.x > P.plat.x + P.plat.w + 14)) P.plat = null;

  function dust() {
    for (let i = 0; i < 7; i++) particles.push({ x: P.x + (Math.random()*36-18), y: P.y - 2,
      vx: (Math.random()-0.5)*1.4, vy: -Math.random()*0.7, life: 300, t: 0, s: 1.4+Math.random()*1.6, ember: false });
  }

  // ---- camera ----
  const camX = Math.max(0, Math.min(WORLD_W - VW, P.x - VW/2));

  // ---- draw ----
  ctx.clearRect(0, 0, VW, VIEW_H);
  const bg = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  bg.addColorStop(0, '#0a0d24'); bg.addColorStop(0.58, '#11142f'); bg.addColorStop(0.76, '#0a0c1c'); bg.addColorStop(1, '#05060c');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VIEW_H);
  ctx.save();
  ctx.translate(0, WORLD_DY);
  // distant pillars
  ctx.fillStyle = 'rgba(38,44,84,0.5)';
  for (let i = 0; i < 9; i++) {
    const px = i*210 - (camX*0.25 % 210), ph = 150 + (i%3)*46;
    ctx.fillRect(px, FLOOR_Y - ph, 54, ph);
  }
  // mirror shards
  for (const sh of shards) {
    const sx = sh.x - camX*sh.p; if (sx < -40 || sx > VW+40) continue;
    const bob = Math.sin(now/1400 + sh.ph) * 4;
    ctx.save(); ctx.translate(sx, sh.y + bob); ctx.rotate(sh.r + Math.sin(now/2400+sh.ph)*0.15);
    const g = ctx.createLinearGradient(-sh.s, -sh.s, sh.s, sh.s);
    g.addColorStop(0, 'rgba(160,190,255,0.20)'); g.addColorStop(0.5, 'rgba(90,120,220,0.10)'); g.addColorStop(1, 'rgba(200,220,255,0.22)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -sh.s); ctx.lineTo(sh.s*0.62, sh.s*0.4); ctx.lineTo(-sh.s*0.5, sh.s*0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // rising embers
  ctx.fillStyle = 'rgba(255,110,60,0.5)';
  for (const e of embers) {
    const ex = e.x - camX*0.8, ey = (e.y - (now*e.v/16 % 560) + 560) % 560;
    if (ex < -6 || ex > VW+6) continue;
    ctx.globalAlpha = 0.25 + 0.3*Math.abs(Math.sin(now/700 + e.ph));
    ctx.beginPath(); ctx.arc(ex, ey, e.s, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // glossy mirror floor
  const fg = ctx.createLinearGradient(0, FLOOR_Y, 0, WORLD_BOT);
  fg.addColorStop(0, '#171b36'); fg.addColorStop(0.12, '#10142a'); fg.addColorStop(1, '#04050a');
  ctx.fillStyle = fg; ctx.fillRect(0, FLOOR_Y, VW, WORLD_BOT - FLOOR_Y);
  ctx.fillStyle = 'rgba(150,175,255,0.55)'; ctx.fillRect(0, FLOOR_Y, VW, 1.6);
  ctx.fillStyle = 'rgba(120,150,255,0.10)'; ctx.fillRect(0, FLOOR_Y + 3, VW, 7);
  // platforms
  for (const pl of platforms) {
    const px = pl.x - camX; if (px + pl.w < -30 || px > VW + 30) continue;
    ctx.fillStyle = '#1a1f3d'; ctx.fillRect(px, pl.y, pl.w, 13);
    ctx.fillStyle = 'rgba(160,185,255,0.65)'; ctx.fillRect(px, pl.y, pl.w, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(px, pl.y + 9, pl.w, 4);
  }
  // reflection (only on the mirror floor)
  const [sn, fi] = frameOf();
  if (P.y >= FLOOR_Y - 0.5) {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, FLOOR_Y + 2, VW, WORLD_BOT - FLOOR_Y);
    ctx.clip();
    ctx.translate(0, 2*FLOOR_Y + 4); ctx.scale(1, -1);
    ctx.globalAlpha = 0.26;
    drawSpriteAt(sn, fi, P.x - camX, P.y, P.dir < 0);
    ctx.restore();
    const fade = ctx.createLinearGradient(0, FLOOR_Y, 0, FLOOR_Y + 92);
    fade.addColorStop(0, 'rgba(10,12,26,0)'); fade.addColorStop(1, 'rgba(6,7,14,0.85)');
    ctx.fillStyle = fade; ctx.fillRect(0, FLOOR_Y, VW, 92);
  }
  // particles behind hero
  drawParticles(now, dt);
  // hero shadow + hero
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(P.x - camX, P.y + 3, 21, 4.5, 0, 0, 6.29); ctx.fill();
  drawSpriteAt(sn, fi, P.x - camX, P.y, P.dir < 0);
  ctx.restore();

  requestAnimationFrame(loop);
}
function drawSpriteAt(name, idx, cx, feetY, flip) {
  const s = SPRITES[name]; if (!s.img.complete || !s.img.naturalWidth) return;
  const fw = s.img.naturalWidth / s.frames, fh = s.img.naturalHeight;
  const dh = 118, dw = fw * dh / fh;
  ctx.save(); ctx.translate(cx, feetY); if (flip) ctx.scale(-1, 1);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(s.img, idx*fw, 0, fw, fh, -dw/2, -dh, dw, dh);
  ctx.restore();
}
function drawParticles(now, dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx; p.y += p.vy;
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = p.ember ? (p.t < p.life*0.4 ? '#ffd23e' : '#ff4d1a') : 'rgba(190,200,230,1)';
    ctx.beginPath(); ctx.arc(p.x - Math.max(0, Math.min(WORLD_W - VW, P.x - VW/2)), p.y, p.s * (p.ember ? a : 1), 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
resize();
requestAnimationFrame(loop);
</script>
